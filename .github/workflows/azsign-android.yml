name: AZSign — APK Android customizado

# Build sob demanda de um APK RustDesk já apontando para o servidor self-hosted
# da AZSign. Somente armeabi-v7a: é a ABI dos TV Box homologados, e compilar só
# uma arquitetura corta o tempo de build para um quarto.
#
# Endereços e chave pública ficam explícitos neste build de migração.
# Somente a assinatura de distribuição usa secrets; nenhuma chave privada
# do servidor deve ser incluída no APK ou neste repositório.
#
# Secrets necessários em Settings → Secrets and variables → Actions:
#   AZSIGN_ANDROID_KEYSTORE_BASE64  keystore de distribuição codificado em base64
#   AZSIGN_ANDROID_KEY_ALIAS        alias da chave
#   AZSIGN_ANDROID_KEYSTORE_PASSWORD
#   AZSIGN_ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Identificador do cliente (só para nomear o APK)"
        required: false
        default: "azsign"

env:
  # Fonte e versões precisam vir do MESMO ponto da história do projeto.
  RUSTDESK_TAG: "1.4.9"
  RUST_VERSION: "1.75"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  # VCPKG_COMMIT_ID da tag 1.4.9 — o mesmo que o job Android do projeto usa.
  #
  # NÃO usar o ARMV7_VCPKG_COMMIT_ID: apesar do nome, ele vale para o build
  # Linux armv7 DESKTOP (linha ~1769 do flutter-build.yml), não para o Android.
  # Ele é de jan/2025 e é velho demais para o vcpkg.json da 1.4.9, que pede
  # pacotes de 2025-05-29.
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  TARGET: "armv7-linux-androideabi"
  ANDROID_ABI: "armeabi-v7a"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espaço no runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: false
          tool-cache: true

      # Lista idêntica à do job Android do projeto. Os *-multilib e o libc6-dev
      # não são opcionais: sem eles o build script do hwcodec falha com
      # "bits/libc-header-start.h file not found" ao rodar bindgen.
      - name: Dependências do sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake curl g++ g++-multilib gcc-multilib git \
            libasound2-dev libayatana-appindicator3-dev libc6-dev libclang-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libgtk-3-dev \
            libpam0g-dev libpulse-dev libunwind-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout da tag ${{ env.RUSTDESK_TAG }} (com submódulos)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUSTDESK_TAG }}
          submodules: recursive

      # ------------------------------------------------------------------
      # AS 4 CUSTOMIZAÇÕES — ver PRD_RustDesk_Build_Proprio.md, seção 4
      # ------------------------------------------------------------------
      - name: Aplicar configuração AZSign
        env:
          HOST: 127.0.0.1
          RELAY: 127.0.0.1:21117
          PUBKEY: syz0DP1/OFnaP8CenzOKiAvMfk1nolNEeFf8vfk2WT8=
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$RELAY"
          test -n "$PUBKEY"

          CFG=libs/hbb_common/src/config.rs
          test -f "$CFG" || { echo "::error::$CFG não existe — submódulo não veio"; exit 1; }

          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          host, relay, key = (os.environ[name] for name in ('HOST', 'RELAY', 'PUBKEY'))
          assert len(base64.b64decode(key, validate=True)) == 32, 'Chave pública inválida'
          assert re.fullmatch(r'[a-z0-9.-]+', host), 'Host inválido'
          assert relay == host + ':21117', 'Relay inesperado'
          path = Path('libs/hbb_common/src/config.rs')
          src = path.read_text()
          replacements = [
              (r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\["[^"]*"\];',
               'pub const RENDEZVOUS_SERVERS: &[&str] = &[' + json.dumps(host) + '];'),
              (r'pub const RS_PUB_KEY: &str = "[^"]*";',
               'pub const RS_PUB_KEY: &str = ' + json.dumps(key) + ';'),
          ]
          for pattern, value in replacements:
              src, count = re.subn(pattern, lambda _: value, src)
              assert count == 1, f'Alvo de configuração inesperado: {pattern}: {count}'

          # A configuração gerenciada também cobre upgrades com servidor antigo
          # salvo e a inicialização nativa no boot, antes de abrir o Flutter.
          old = 'pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
          assert src.count(old) == 1, 'Alvo OVERWRITE_SETTINGS inesperado'
          entries = ',\n'.join(
              f'            ({json.dumps(name)}.to_owned(), {json.dumps(value)}.to_owned())'
              for name, value in [('custom-rendezvous-server', host), ('relay-server', relay), ('key', key), ('disable-tcp-listen', 'Y'), ('force-always-relay', 'Y')]
          )
          new = ('pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = {\n'
                 '        #[cfg(target_os = "android")]\n'
                 '        { RwLock::new(HashMap::from([\n' + entries + '\n        ])) }\n'
                 '        #[cfg(not(target_os = "android"))]\n'
                 '        { Default::default() }\n'
                 '    };')
          path.write_text(src.replace(old, new))
          PYEOF

          # 3: iniciar na inicialização — default do SharedPreferences.
          #    Não é alcançável por OVERWRITE_SETTINGS: vive fora do config do Rust.
          BOOT=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/BootReceiver.kt
          MAIN=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt
          sed -i 's|getBoolean(KEY_START_ON_BOOT_OPT, false)|getBoolean(KEY_START_ON_BOOT_OPT, true)|g' "$BOOT" "$MAIN"

          echo "--- conferindo o que ficou gravado:"
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY" "$CFG" | sed 's|RS_PUB_KEY.*|RS_PUB_KEY: <chave oculta>|'
          grep -n "KEY_START_ON_BOOT_OPT" "$BOOT" "$MAIN"

      # ------------------------------------------------------------------
      # Provisionamento sem ninguém na frente da TV.
      #
      # Cada substituição abaixo ABORTA o build se o texto original não for
      # encontrado. Isso é deliberado: um `sed` que não casa passa silencioso e
      # gera um APK sem a customização, que só se descobre no aparelho. Se a
      # 1.4.9 mudar, o build quebra aqui, onde dá para ler o motivo.
      # ------------------------------------------------------------------
      - name: Patches de provisionamento AZSign
        run: |
          python3 - <<'PYEOF'
          import sys

          def patch(path, old, new, nome):
              src = open(path, encoding='utf-8').read()
              if new in src:
                  print(f'  = {nome}: já aplicado')
                  return
              if src.count(old) != 1:
                  sys.exit(f'::error::{nome}: esperava 1 ocorrência em {path}, '
                           f'achei {src.count(old)}. A 1.4.9 mudou?')
              open(path, 'w', encoding='utf-8').write(src.replace(old, new))
              print(f'  + {nome}: aplicado em {path}')

          # --- 1. Liberar os deep links de provisionamento -----------------
          # `rustdesk://password/<senha>` é o caminho OFICIAL do RustDesk para
          # definir a senha permanente, mas vem trancado atrás de uma opção que
          # só o cliente pago do RustDesk consegue destravar (o custom.txt é
          # assinado com a chave privada deles). Como compilamos o nosso, a
          # liberação vira uma condição na própria leitura da opção.
          patch(
              'src/common.rs',
              'pub fn get_builtin_option(key: &str) -> String {\n',
              'pub fn get_builtin_option(key: &str) -> String {\n'
              '    // AZSign: o Box Manager provisiona a senha por deep link, via ADB.\n'
              '    if key == "allow-deep-link-password"\n'
              '        || key == "allow-deep-link-server-settings"\n'
              '    {\n'
              '        return "Y".to_owned();\n'
              '    }\n',
              'deep links liberados',
          )

          # --- 2. Remover o aviso anti-golpe ------------------------------
          # O diálogo trava o start do serviço atrás de um clique humano com
          # contagem regressiva. Num player instalado em ponto de cliente não
          # há humano para clicar.
          patch(
              'flutter/lib/mobile/pages/server_page.dart',
              '                onPressed: () {\n'
              '                  if (gFFI.userModel.userName.value.isEmpty &&\n'
              '                      bind.mainGetLocalOption(key: "show-scam-warning") !=\n'
              '                          "N") {\n'
              '                    showScamWarning(context, serverModel);\n'
              '                  } else {\n'
              '                    serverModel.toggleService();\n'
              '                  }\n'
              '                },\n',
              '                onPressed: () {\n'
              '                  // AZSign: sem aviso anti-golpe — não há ninguém na TV.\n'
              '                  serverModel.toggleService();\n'
              '                },\n',
              'aviso anti-golpe removido',
          )

          # --- 3. Publicar o ID onde o ADB alcança ------------------------
          # O ID mora em RustDesk.toml como `enc_id`, dentro de /data/data, que
          # o ADB não lê sem root. getExternalStorageDirectory() cai em
          # /sdcard/Android/data/<pkg>/files, que o ADB lê.
          #
          # Não confunda com `info1-id` do logcat: aquele é o mesmo valor em
          # aparelhos diferentes, não é o ID do RustDesk.
          MODEL = 'flutter/lib/models/server_model.dart'
          patch(
              MODEL,
              "import 'dart:async';\nimport 'dart:convert';\n",
              "import 'dart:async';\nimport 'dart:convert';\nimport 'dart:io';\n\n"
              "import 'package:path_provider/path_provider.dart';\n",
              'imports do publicador de ID',
          )
          patch(
              MODEL,
              '  fetchID() async {\n'
              '    final id = await bind.mainGetMyId();\n'
              '    if (id != _serverId.id) {\n'
              '      _serverId.id = id;\n'
              '      notifyListeners();\n'
              '    }\n'
              '  }\n',
              '  fetchID() async {\n'
              '    final id = await bind.mainGetMyId();\n'
              '    if (id != _serverId.id) {\n'
              '      _serverId.id = id;\n'
              '      notifyListeners();\n'
              '      azsignPublishId(id);\n'
              '    }\n'
              '  }\n'
              '\n'
              '  /// AZSign: grava o ID num arquivo legível por ADB sem root, para o\n'
              '  /// Box Manager mostrar o endereço do aparelho sem olhar a TV.\n'
              '  Future<void> azsignPublishId(String id) async {\n'
              '    if (!isAndroid || id.isEmpty) return;\n'
              '    try {\n'
              '      final dir = await getExternalStorageDirectory();\n'
              '      if (dir == null) return;\n'
              "      await File('${dir.path}/azsign-rustdesk-id.txt').writeAsString(id);\n"
              '    } catch (e) {\n'
              "      debugPrint('AZSign: falha ao publicar o ID: $e');\n"
              '    }\n'
              '  }\n',
              'publicador de ID',
          )

          # --- 3b. Publicar o ID sem depender da aba -----------------------
          # `fetchID()` só é chamado dentro da aba "Compartilhar Tela"
          # (server_page.dart:189). Pendurar a publicação só nele exigiria o
          # toque na TV que este build existe para eliminar — medido num DC400
          # em 16/09/2026: o arquivo só apareceu depois de navegar até a aba.
          # O timer no construtor cobre a abertura normal do app.
          patch(
              MODEL,
              "    // Initial keyboard status is off on mobile\n"
              "    if (isMobile) {\n"
              "      bind.mainSetOption(key: kOptionEnableKeyboard, value: 'N');\n"
              "    }\n"
              '  }\n',
              "    // Initial keyboard status is off on mobile\n"
              "    if (isMobile) {\n"
              "      bind.mainSetOption(key: kOptionEnableKeyboard, value: 'N');\n"
              "    }\n"
              '\n'
              '    // AZSign: publica o ID assim que ele existir. Desiste depois de\n'
              '    // ~60s para não deixar um timer vivo à toa num player ligado 24h.\n'
              '    if (isAndroid && !isTest) {\n'
              '      Timer.periodic(const Duration(seconds: 2), (timer) async {\n'
              '        final id = await bind.mainGetMyId();\n'
              '        if (id.isNotEmpty) {\n'
              '          timer.cancel();\n'
              '          azsignPublishId(id);\n'
              '        } else if (timer.tick >= 30) {\n'
              '          timer.cancel();\n'
              '        }\n'
              '      });\n'
              '    }\n'
              '  }\n',
              'publicador de ID na abertura',
          )
          # --- 4. Sincronizar controle também no boot sem Flutter ---------
          # InputService pode conectar antes do MainService; só escrevemos
          # opções depois que startServer definiu o diretório da configuração.
          patch(
              'flutter/android/app/src/main/kotlin/ffi.kt',
              '    external fun startService()\n',
              '    external fun startService()\n'
              '    external fun setInputServiceEnabled(enabled: Boolean)\n',
              'ponte nativa do estado de controle',
          )
          patch(
              'src/flutter_ffi.rs',
              '    #[no_mangle]\n'
              '    pub unsafe extern "system" fn Java_ffi_FFI_startService(',
              '    #[no_mangle]\n'
              '    pub unsafe extern "system" fn Java_ffi_FFI_setInputServiceEnabled(\n'
              '        _env: JNIEnv,\n'
              '        _class: JClass,\n'
              '        enabled: jboolean,\n'
              '    ) {\n'
              '        let value = if enabled != 0 { "" } else { "N" };\n'
              '        log::info!("AZSign: input service enabled={}", enabled != 0);\n'
              '        super::main_set_option(\n'
              '            config::keys::OPTION_ENABLE_KEYBOARD.to_owned(),\n'
              '            value.to_owned(),\n'
              '        );\n'
              '    }\n\n'
              '    #[no_mangle]\n'
              '    pub unsafe extern "system" fn Java_ffi_FFI_startService(',
              'atualizar configuração e permissões das sessões',
          )
          INPUT = 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/InputService.kt'
          patch(
              INPUT,
              '        var ctx: InputService? = null\n',
              '        var ctx: InputService? = null\n'
              '        private var azsignServerReady = false\n\n'
              '        fun azsignServerStarted() {\n'
              '            azsignServerReady = true\n'
              '            azsignSyncInputState()\n'
              '        }\n\n'
              '        fun azsignServerStopped() {\n'
              '            azsignServerReady = false\n'
              '        }\n\n'
              '        private fun azsignSyncInputState() {\n'
              '            if (azsignServerReady) {\n'
              '                ffi.FFI.setInputServiceEnabled(isOpen)\n'
              '            }\n'
              '        }\n',
              'sincronização nativa após inicialização da configuração',
          )
          patch(
              INPUT,
              '    private fun notifyInputState() {\n',
              '    private fun notifyInputState() {\n'
              '        azsignSyncInputState()\n',
              'publicar conexão e desconexão da acessibilidade',
          )
          SERVICE = 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt'
          patch(
              SERVICE,
              '        FFI.startServer(configPath, "")\n',
              '        FFI.startServer(configPath, "")\n'
              '        InputService.azsignServerStarted()\n',
              'restaurar estado no boot sem Activity',
          )
          patch(
              SERVICE,
              '    override fun onDestroy() {\n',
              '    override fun onDestroy() {\n'
              '        InputService.azsignServerStopped()\n',
              'encerrar sincronização junto com o servidor',
          )
          patch(
              MODEL,
              '    // Initial keyboard status is off on mobile\n'
              '    if (isMobile) {\n',
              '    // AZSign: Android input permission follows the native service lifecycle.\n'
              '    if (isIOS) {\n',
              'não sobrescrever estado Android ao abrir Flutter',
          )
          patch(
              MODEL,
              "      case \"input\":\n        if (_inputOk != value) {\n",
              "      case \"input\":\n        if (!isAndroid && _inputOk != value) {\n",
              'Android nativo é a fonte da permissão de controle',
          )
          # --- 5. Desativar áudio no player AZSign ------------------------
          # Alguns firmwares Amlogic Android 11 abortam nativamente em
          # AudioRecord.getMinFrameCount() quando o RustDesk tenta iniciar
          # playback capture. Isso derruba a sessão logo após a senha e faz
          # o cliente mostrar "connection reset by peer". O player precisa
          # de vídeo e entrada, não de áudio remoto.
          patch(
              SERVICE,
              '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
              '            if (!audioRecordHandle.createAudioRecorder(false, mediaProjection)) {\n'
              '                Log.d(logTag, "createAudioRecorder fail")\n'
              '            } else {\n'
              '                Log.d(logTag, "audio recorder start")\n'
              '                audioRecordHandle.startAudioRecorder()\n'
              '            }\n'
              '        }\n',
              '        // AZSign: áudio remoto desativado para compatibilidade com TV Box.\n'
              '        Log.d(logTag, "AZSign: audio capture disabled for TV box compatibility")\n',
              'captura de áudio desativada nos TV Box',
          )
          # --- 6. Duração mínima dos toques -------------------------------
          # Hipótese de compatibilidade em teste. O mínimo de 40 ms sozinho
          # não resolveu os cliques no Aquário; os callbacks abaixo permitem
          # investigar a execução real dos gestos no framework.
          patch(
              INPUT,
              '        if (duration <= 0) {\n'
              '            duration = 1\n'
              '        }\n',
              '        duration = duration.coerceAtLeast(40L)\n',
              'duração mínima dos gestos de toque',
          )
          patch(
              INPUT,
              '    private val logTag = "input service"\n',
              '    private val logTag = "input service"\n'
              '    private val azsignGestureSequence = java.util.concurrent.atomic.AtomicLong(0)\n',
              'sequência de diagnóstico de gestos',
          )
          patch(
              INPUT,
              '                Log.d(logTag, "doDispatchGesture x:$x y:$y time:$duration")\n'
              '                dispatchGesture(builder.build(), null, null)\n',
              '                val diagnosticId = azsignGestureSequence.incrementAndGet()\n'
              '                val submittedAt = android.os.SystemClock.uptimeMillis()\n'
              '                Log.i("AZSignGesture", "submit id=$diagnosticId duration=$duration continue=$willContinue")\n'
              '                val accepted = dispatchGesture(builder.build(), object : android.accessibilityservice.AccessibilityService.GestureResultCallback() {\n'
              '                    override fun onCompleted(gestureDescription: GestureDescription) {\n'
              '                        Log.i("AZSignGesture", "completed id=$diagnosticId elapsed=${android.os.SystemClock.uptimeMillis() - submittedAt}")\n'
              '                    }\n'
              '                    override fun onCancelled(gestureDescription: GestureDescription) {\n'
              '                        Log.w("AZSignGesture", "cancelled id=$diagnosticId elapsed=${android.os.SystemClock.uptimeMillis() - submittedAt}")\n'
              '                    }\n'
              '                }, android.os.Handler(android.os.Looper.getMainLooper()))\n'
              '                Log.i("AZSignGesture", "accepted id=$diagnosticId value=$accepted")\n',
              'retorno e callbacks dos gestos de toque',
          )
          PYEOF

      - name: Checkout do protótipo de entrada root
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pilot-support
          sparse-checkout: |
            .github/azsign-root-input
            .github/azsign-aquario-input
            .github/azsign-smartpro-input
            .github/azsign-password-confirmation
            .github/azsign-access-poc
            .github/azsign-dpad

      - name: Aplicar protótipo MCD-125 (opt-in)
        run: python3 pilot-support/.github/azsign-root-input/apply.py

      - name: Aplicar piloto de clique nativo Aquário
        run: python3 pilot-support/.github/azsign-aquario-input/apply.py

      - name: Aplicar recuperação de acessibilidade SmartPro
        run: python3 pilot-support/.github/azsign-smartpro-input/apply.py

      - name: Aplicar confirmação de senha AZSign (somente ADB)
        run: node pilot-support/.github/azsign-password-confirmation/apply.mjs .

      - name: Aplicar transporte autenticado isolado (PoC, nunca produção)
        run: node pilot-support/.github/azsign-access-poc/apply.mjs .

      - name: Validar geração de identidade e prova de posse (sem chave no build)
        run: |
          set -euo pipefail
          export BC_TEST_DEPS="$RUNNER_TEMP/azsign-bc-test"
          mkdir -p "$BC_TEST_DEPS"
          for artifact in bcpkix bcprov bcutil; do
            curl --fail --silent --show-error --location \
              "https://repo.maven.apache.org/maven2/org/bouncycastle/${artifact}-jdk15to18/1.86/${artifact}-jdk15to18-1.86.jar" \
              -o "$BC_TEST_DEPS/${artifact}.jar"
          done
          node pilot-support/.github/azsign-access-poc/identity.test.mjs

      - name: Aplicar navegação D-pad por acessibilidade (sem root)
        run: node pilot-support/.github/azsign-dpad/apply.mjs .

      - name: Flutter ${{ env.ANDROID_FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch do Flutter (exigido pelo projeto em 3.24.5)
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: azsign-${{ env.TARGET }}

      - name: Gerar a ponte Dart/Rust
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Dependências nativas (libvpx, aom, opus, libyuv)
        run: ./flutter/build_android_deps.sh "${{ env.ANDROID_ABI }}"

      - name: Compilar a lib Rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}
          cp ./target/${{ env.TARGET }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/librustdesk.so

      - name: Compilar o APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          KEYSTORE_BASE64: ${{ secrets.AZSIGN_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.AZSIGN_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AZSIGN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AZSIGN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret AZSIGN_ANDROID_KEYSTORE_BASE64 não definido"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::secret AZSIGN_ANDROID_KEY_ALIAS não definido"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::secret AZSIGN_ANDROID_KEYSTORE_PASSWORD não definido"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::secret AZSIGN_ANDROID_KEY_PASSWORD não definido"; exit 1; }
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > ./flutter/android/app/azsign-release.jks
          cat > ./flutter/android/key.properties <<EOF
          storeFile=azsign-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so \
             ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/
          pushd flutter
          flutter build apk --release --target-platform android-arm --split-per-abi --build-name=1.4.9-azsign-access-poc-v18 --build-number=3078
          mv build/app/outputs/flutter-apk/app-${{ env.ANDROID_ABI }}-release.apk \
             ../rustdesk-azsign-${{ github.event.inputs.cliente }}-armv7.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-azsign-${{ github.event.inputs.cliente }}
          path: rustdesk-azsign-*.apk
          retention-days: 30
