name: AZSign — APK Android customizado

# Build sob demanda de um APK RustDesk já apontando para o servidor self-hosted
# da AZSign. Somente armeabi-v7a: é a ABI dos TV Box homologados, e compilar só
# uma arquitetura corta o tempo de build para um quarto.
#
# Servidor e chave NÃO ficam no repositório — vêm de secrets e são injetados
# no config.rs antes de compilar. Assim o fork pode ser público (Actions grátis
# ilimitado) sem expor o endereço do servidor.
#
# Secrets necessários em Settings → Secrets and variables → Actions:
#   RUSTDESK_HOST     ex.: 74.208.72.16
#   RUSTDESK_PUB_KEY  a chave pública do hbbs (id_ed25519.pub)

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Identificador do cliente (só para nomear o APK)"
        required: false
        default: "azsign"

env:
  # Fonte e versões precisam vir do MESMO ponto da história do projeto.
  RUSTDESK_TAG: "1.4.9"
  RUST_VERSION: "1.75"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  # Commit do vcpkg específico do armv7: com o mais novo o build falha com
  # "vcpkg: No such file or directory" (comentário do próprio projeto).
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  TARGET: "armv7-linux-androideabi"
  ANDROID_ABI: "armeabi-v7a"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espaço no runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: false
          tool-cache: true

      - name: Dependências do sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake curl gcc git g++ libclang-dev llvm-dev \
            nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget \
            libgtk-3-dev libxcb-randr0-dev libxdo-dev libxfixes-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev libasound2-dev

      # A tag, não o master: a matriz de versões abaixo foi extraída do
      # workflow da 1.4.9. Compilar o master com o vcpkg da 1.4.9 falha com
      # "no version database entry for vcpkg-cmake-config" — o vcpkg.json do
      # master exige uma baseline mais nova.
      - name: Checkout da tag ${{ env.RUSTDESK_TAG }} (com submódulos)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUSTDESK_TAG }}
          submodules: recursive

      # ------------------------------------------------------------------
      # AS 4 CUSTOMIZAÇÕES — ver PRD_RustDesk_Build_Proprio.md, seção 4
      # ------------------------------------------------------------------
      - name: Aplicar configuração AZSign
        env:
          HOST: ${{ secrets.RUSTDESK_HOST }}
          PUBKEY: ${{ secrets.RUSTDESK_PUB_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST"   || { echo "::error::secret RUSTDESK_HOST não definido"; exit 1; }
          test -n "$PUBKEY" || { echo "::error::secret RUSTDESK_PUB_KEY não definido"; exit 1; }

          CFG=libs/hbb_common/src/config.rs
          test -f "$CFG" || { echo "::error::$CFG não existe — submódulo não veio"; exit 1; }

          # 1 e 2: servidor e chave pública
          sed -i "s|pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[\"[^\"]*\"\];|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"$HOST\"];|" "$CFG"
          sed -i "s|pub const RS_PUB_KEY: &str = \"[^\"]*\";|pub const RS_PUB_KEY: \&str = \"$PUBKEY\";|" "$CFG"

          # 3: iniciar na inicialização — default do SharedPreferences.
          #    Não é alcançável por OVERWRITE_SETTINGS: vive fora do config do Rust.
          BOOT=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/BootReceiver.kt
          MAIN=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt
          sed -i 's|getBoolean(KEY_START_ON_BOOT_OPT, false)|getBoolean(KEY_START_ON_BOOT_OPT, true)|g' "$BOOT" "$MAIN"

          echo "--- conferindo o que ficou gravado:"
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY" "$CFG" | sed 's/'"$PUBKEY"'/<chave oculta>/'
          grep -n "KEY_START_ON_BOOT_OPT" "$BOOT" "$MAIN"

      - name: Flutter ${{ env.ANDROID_FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch do Flutter (exigido pelo projeto em 3.24.5)
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: azsign-${{ env.TARGET }}

      - name: Gerar a ponte Dart/Rust
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Dependências nativas (libvpx, aom, opus, libyuv)
        run: ./flutter/build_android_deps.sh "${{ env.ANDROID_ABI }}"

      - name: Compilar a lib Rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}
          cp ./target/${{ env.TARGET }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/librustdesk.so

      - name: Compilar o APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so \
             ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/
          pushd flutter
          flutter build apk --release --target-platform android-arm --split-per-abi
          mv build/app/outputs/flutter-apk/app-${{ env.ANDROID_ABI }}-release.apk \
             ../rustdesk-azsign-${{ github.event.inputs.cliente }}-armv7.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-azsign-${{ github.event.inputs.cliente }}
          path: rustdesk-azsign-*.apk
          retention-days: 30
