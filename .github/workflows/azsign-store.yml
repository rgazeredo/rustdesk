name: AZSign Remote Store package
on:
  workflow_dispatch:
  push:
    branches: [release/remote-store-1.5.3]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify runtime provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/37376782844" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne 'fb3d155675b8b25e69025af6a7188fa0444de101') { throw 'Runtime build is not verified' }
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.path -ne '.github/workflows/azsign-windows-pilot.yml') { throw 'Unexpected runtime origin' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AZSignRemote-windows-x64
          path: source
          run-id: 37376782844
          github-token: ${{ github.token }}
      - name: Prepare verified bundle
        shell: pwsh
        run: |
          $expected = (Get-Content source/AZSignRemote-windows-x64.sha256 -Raw).Trim()
          if ((Get-FileHash source/AZSignRemote-windows-x64.zip -Algorithm SHA256).Hash -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive source/AZSignRemote-windows-x64.zip bundle
          if ((Get-Content bundle/BUILD-COMMIT.txt -Raw).Trim() -ne 'fb3d155675b8b25e69025af6a7188fa0444de101') { throw 'Wrong runtime commit' }
      - name: Build unsigned package for Partner Center
        shell: pwsh
        run: |
          ./.github/azsign-access-poc/msix/package.ps1 -BundleDir bundle -OutputDir store -Store -Version 1.5.3.0
      - name: Prepare separately signed copies for lifecycle tests
        shell: pwsh
        run: |
          $subject = 'CN=35807B66-E500-4349-BF5A-D47A051E620C'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -FriendlyName 'AZSign CI test only' -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(7) -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Where-Object { Test-Path "$($_.FullName)\x64\signtool.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory test-packages | Out-Null
          try {
            Export-Certificate -Cert $cert -FilePath test-packages/AZSign-Remote-Test.cer | Out-Null
            Copy-Item store/AZSign-Remote-1.5.3.0-x64.msix test-packages/AZSign-Remote-Test-1.5.3.0-x64.msix
            ./.github/azsign-access-poc/msix/package.ps1 -BundleDir bundle -OutputDir upgrade -Store -Version 1.5.4.0
            Copy-Item upgrade/AZSign-Remote-1.5.4.0-x64.msix test-packages/AZSign-Remote-Test-1.5.4.0-x64.msix
            foreach ($file in Get-ChildItem test-packages/*.msix) {
              & "$($sdk.FullName)\x64\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint /s My $file.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Test signing failed' }
            }
          } finally { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey }
      - name: Verify Store identity, protocol, DPAPI and upgrade
        shell: powershell
        run: ./.github/azsign-access-poc/msix/test.ps1 -PackageDir test-packages -BundleDir bundle -IdentityName AZSign.AZSignRemote -InitialVersion 1.5.3.0 -UpgradeVersion 1.5.4.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: AZSign-Remote-1.5.3-Store
          path: store/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Store-lifecycle-results
          path: msix-results/*
          if-no-files-found: ignore
          retention-days: 14
